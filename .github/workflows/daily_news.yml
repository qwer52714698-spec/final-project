name: Daily News & Stock Collector

on:
  schedule:
    - cron: '7 0 * * *' # 매일 한국 시간 09:07 실행
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas # 필수 라이브러리 명시
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Data Collection
        env:
          # 데이터베이스 및 API 키 설정
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          echo "시작: 뉴스 수집"
          python -m backend.services.news_collector
          echo "시작: 주가 수집"
          python -m backend.services.stock_collector

      - name: Create Integrated Summary Report
        if: always() # 실패하더라도 어디까지 됐는지 리포트 생성
        run: |
          NEWS_COUNT=$(cat collect_result.txt || echo "0")
          STOCK_COUNT=$(cat stock_collect_result.txt || echo "0")
          
          echo "### 🚀 통합 수집 리포트 ($(date +'%Y-%m-%d'))" >> $GITHUB_STEP_SUMMARY
          echo "| 수집 항목 | 결과 |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **신규 뉴스 기사** | $NEWS_COUNT 개 |" >> $GITHUB_STEP_SUMMARY
          echo "| **업데이트된 주가** | $STOCK_COUNT 건 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "작업 완료 시간: $(date)" >> $GITHUB_STEP_SUMMARY 